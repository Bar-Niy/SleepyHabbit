name: sleepy_habbit
description: A Flutter app to improve your sleeping habits through AI-powered diary and sleep analysis.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.0.0

  # Local Database
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.2
  path: ^1.8.3

  # Audio / TTS / STT
  flutter_tts: ^3.8.5
  speech_to_text: ^6.6.0
  record: ^5.0.4
  audioplayers: ^5.2.1

  # Camera & Image
  camera: ^0.10.5+9
  image_picker: ^1.0.7

  # LLM Integration (local on-device via llama.cpp or API fallback)
  http: ^1.2.0
  dio: ^5.4.0

  # Google Drive Backup
  googleapis: ^12.0.0
  googleapis_auth: ^1.5.0
  google_sign_in: ^6.2.1
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # Notifications & Alarms
  flutter_local_notifications: ^17.0.0
  android_alarm_manager_plus: ^4.0.1
  timezone: ^0.9.2

  # UI
  flutter_animate: ^4.3.0
  intl: ^0.19.0

  # Permissions
  permission_handler: ^11.2.0

  # Shared Preferences
  shared_preferences: ^2.2.2

  # UUID
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  drift_dev: ^2.14.1
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-Light.ttf
          weight: 300
